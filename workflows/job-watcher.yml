name: Job Watcher

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run watch:jobs
      - name: Commit updated watcher feed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/job-feed.json || true
          git commit -m "chore: update watcher feed" || exit 0
          git push
